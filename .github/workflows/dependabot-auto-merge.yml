name: Dependabot auto-merge

# Approves and enables auto-merge only for Dependabot's grouped minor/patch
# PRs (see .github/dependabot.yml's `groups`) — GitHub still blocks the
# actual merge until every required CI check passes. Ungrouped PRs (security
# advisories, major version bumps) are deliberately left out: those still
# need a human look.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # GitHub permits approving a Dependabot-authored PR with the default
      # token specifically for this automation pattern — it would not work
      # for a human-authored PR (no self-approval).
      - name: Approve
        if: steps.metadata.outputs.dependency-group-name != ''
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.dependency-group-name != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
